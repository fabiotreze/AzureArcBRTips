# Keeps workbooks/arc-agent-support/agent-releases.json current. Workbooks read it at run time.
# Sources: Microsoft Learn release notes + the Microsoft agent download host (see scripts/Update-AgentReleases.ps1).
# The file is committed only when the calendar changes. On any source error the job fails and the file stays as it was.
name: Update agent release calendar

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-agent-releases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the release calendar
        shell: pwsh
        run: ./scripts/Update-AgentReleases.ps1 -OutFile ./workbooks/arc-agent-support/agent-releases.json

      - name: Commit when the calendar changed
        shell: bash
        run: |
          f=workbooks/arc-agent-support/agent-releases.json
          if git diff --quiet -- "$f"; then
            echo "Calendar unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Update Arc agent release calendar"
          git push
